# @package _global_
defaults:
  - /callback/performance@callbacks.performance
  - /optim: sft
  - _self_

run_name: ${oc.select:model.acoustic.name,token}
repo_output_root: ${oc.env:SPEECH_TO_SPEECH_TRAIN_ROOT,${oc.env:DYNAMIC_HOME}/train/speech-to-speech}
output_subdir: train/${run_name}
output_dir: ${repo_output_root}/${output_subdir}

datamodule:
  codec: ${runtime.audio_output.tokenizer}
  source:
    factory:
    mode: auto
    options: {}
    toy:
      warmup_steps: 5
      measure_window_steps: 20
      log_every_n_steps: 1
  materialization:
    enabled: false
    codec_view:
    output_root:
    device:
    provider_id:
    input_id:
    source_factory:
    max_shard_samples: 100000
    batch_size: 1
    commit_samples:
    write_workers: 1
    write_prefetch:
  streaming:
    enabled: false
    root:
    stream_id:
    expected_samples:
    poll_seconds: 30.0
    status_seconds: 60.0
    producer_factory:
    producer_options: {}
    telemetry:
      enabled: true
      gpu_sample_interval_seconds: 1.0
      log_every_n_steps: 1
  dataloader:
    batch_size: 8
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    costs:
      enabled: true
      max_batch_frames: 4800
      planning_window: 256
  tasks:
    audio_ar: { template: null }
    asr: { template: null }
    interleaved_ar: { template: null }
    masked_ar: { template: null }
    mt: { template: null }
    parallel_ar: { template: null }
    s2st: { template: null }
    s2tt: { template: null }
    text_ar: { template: null }
    t2st: { template: null }
    t2tt: { template: null }
    tts: { template: null }
    tts_voice_clone: { template: null }

text_datamodule:
  dataloader:
    batch_size: 8
    num_workers: 4
    pin_memory: true
    persistent_workers: true
  dataset:
    name: wmt19
    split: train
    config_name:
    source_lang: zh
    target_lang: en
    toy_samples: 8
    # Local general-text corpora may use JSONL (one string or {text, lang}
    # object per line) or a single UTF-8 document.  Keep the path unset for
    # the existing WMT19 default.
    path:
    format:
    encoding: utf-8
    language: en
  # Token packing is applied after tokenizer conversion and is intended for
  # instruction-free TEXT_AR pretraining.
  max_tokens:
  pack_documents: false

train:
  seed: 0
  max_steps: 1000000
  ckpt_path:
  auto_resume: false

validation:
  enabled: true
  loader: tts
  split_label: dev
  text_split: validation
  max_samples: 1000
  every_n_steps: 10000
  sanity_steps: 0
  loaders:
    s2tt:
      task: s2tt
      shape: pair
      max_samples: 1000
      batch_size: 1
      num_workers: 0
      trace:
      dataset:
        name: covost2
        root:
        split: validation
        filter:
        split_manifest:
        split_label: validation
        speaker:
        source_lang: zh
        target_lang: en
        toy_samples: 8
        toy_frames: 4
    tts:
      task: tts
      shape: single
      max_samples: 1000
      batch_size: 1
      num_workers: 0
      trace:
      dataset:
        name: libritts
        root:
        split: dev-clean
        filter:
        split_manifest:
        split_label: validation
        speaker:
        source_lang:
        target_lang:
        toy_samples: 8
        toy_frames: 4

callbacks:
  synthesis_sample:
    enabled: false
    every_n_steps: 100
    loader: s2st
    indices: []
  task_sample:
    enabled: false
    every_n_steps: 10000
    panels: []
    seed: 0
    max_new_tokens: 256
    temperature: 1.0
    top_p: 1.0
    do_sample: false
    use_cache: true
  text_retention:
    enabled: true
    every_n_steps: 10000
    max_new_tokens: 64
    probes:
      zh_en:
        instruction: "Translate into English: \u6628\u665a\u7684\u66b4\u96e8\u5bfc\u81f4\u4e09\u8d9f\u5217\u8f66\u665a\u70b9\u3002"
        reference: "Last night's heavy rain delayed three trains."
  gradient_probe:
    enabled: false
    every_n_steps: 10000
    comparisons:
      - left:
          loss: token
          group: asr
        right:
          loss: token
          group: tts
    probes:
      backbone_l0_attn_lora:
        match: regex
        trainable_only: true
        parameters:
          - model\.backbone\.(?:layers|mimo_layers)\.0\.self_attn\.(q_proj|k_proj|v_proj|o_proj)\.lora_[AB]\..*\.weight$
      backbone_l0_ffn_lora:
        match: regex
        trainable_only: true
        parameters:
          - model\.backbone\.(?:layers|mimo_layers)\.0\.mlp\.(gate_proj|up_proj|down_proj)\.lora_[AB]\..*\.weight$
  checkpoint:
    filename: step-{step:08d}
    save_last: true
    save_top_k: -1
    every_n_train_steps: 10000
  performance:
    enabled: false
