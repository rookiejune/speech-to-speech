# @package _global_
defaults:
  - /stage: stage_1
  - /parameter_policy: lora
  - /model: default
  - /model/acoustic: rvq
  - /runtime: longcat_native
  - /audio_route: semantic_generator
  - /data@data.dataset: wmt19_tts
  - /pl_module: sft
  - /trainer: staged_static_ddp
  - /logging: tensorboard
  - /callback/performance@callbacks.performance
  - _self_

run_name: ${stage.name}-${oc.select:acoustic.name,token}
repo_output_root: ${oc.env:SPEECH_TO_SPEECH_TRAIN_ROOT,${oc.env:DYNAMIC_HOME}/train/speech-to-speech}
output_subdir: 011-staged-joint-train/${stage.name}/${run_name}
output_dir: ${repo_output_root}/${output_subdir}

data:
  codec: ${runtime.codec}
  dataloader:
    batch_size: 8
    num_workers: 4
    pin_memory: true
    persistent_workers: true

text_data:
  dataloader:
    batch_size: 8
    num_workers: 4
    pin_memory: true
    persistent_workers: true
  dataset:
    name: wmt19
    split: train
    config_name:
    source_lang: zh
    target_lang: en
    toy_samples: 8

train:
  seed: 0
  max_steps: 1000000
  ckpt_path:

validation:
  enabled: false
  loader: tts
  split_label: dev
  text_split: validation
  max_samples: 1000
  every_n_steps: 1000
  sanity_steps: -1

callbacks:
  task_sample:
    enabled: false
    every_n_steps: 10000
    panels: []
    seed: 0
    max_new_tokens: 256
    temperature: 1.0
    top_p: 1.0
    do_sample: false
    use_cache: true
  text_retention:
    enabled: true
    every_n_steps: 10000
    max_new_tokens: 64
    probes:
      zh_en:
        instruction: "Translate into English: \u6628\u665a\u7684\u66b4\u96e8\u5bfc\u81f4\u4e09\u8d9f\u5217\u8f66\u665a\u70b9\u3002"
        reference: "Last night's heavy rain delayed three trains."
  gradient_probe:
    enabled: false
    every_n_steps: 10000
    comparisons:
      - left:
          loss: token
          group: asr
        right:
          loss: token
          group: tts
    probes:
      backbone_l0_attn_lora:
        match: regex
        trainable_only: true
        parameters:
          - model\.backbone\.model\.layers\.0\.self_attn\.(q_proj|k_proj|v_proj|o_proj)\.lora_[AB]\..*\.weight$
      backbone_l0_ffn_lora:
        match: regex
        trainable_only: true
        parameters:
          - model\.backbone\.model\.layers\.0\.mlp\.(gate_proj|up_proj|down_proj)\.lora_[AB]\..*\.weight$
  checkpoint:
    filename: step-{step:08d}
    save_last: true
    save_top_k: -1
    every_n_train_steps: 10000
  performance:
    enabled: false
  data_throughput:
    enabled: false
    log_every_n_steps: 100
    warmup_steps: 20
    measure_window_steps: 100
    sync_cuda: true
