# @package _global_
defaults:
  - /model: default
  - /model/acoustic: none
  - /runtime: bicodec
  - /data: bicodec_tts
  - /pl_module: sft
  - /trainer: default
  - /logging: tensorboard
  - override /parameter_policy: full
  - _self_

task: tts
run_name: bicodec-tts-qwen3
output_subdir: 015-bicodec-tts-overfit/${task}/${run_name}

data:
  sample_index: 0
  shape: single
  encode_missing_codes: false

callbacks:
  task_sample:
    enabled: false
    every_n_steps: 1
  evaluation:
    enabled: false

train:
  seed: 0
  max_steps: 2

trainer:
  log_every_n_steps: 1
  enable_checkpointing: false
