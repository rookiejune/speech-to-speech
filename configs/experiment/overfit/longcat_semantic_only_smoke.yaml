# @package _global_
defaults:
  - /callback/parameter_policy@callbacks.parameter_policy: semantic_only
  - /model: toy
  - /model/acoustic@model.acoustic: none
  - /runtime: longcat_native
  - /datamodule/dataset@datamodule.dataset: toy
  - /pl_module: sft
  - /trainer: default
  - /logging: csv
  - _self_

audio_sequence_layout: semantic

task: tts
run_name: longcat-semantic-only
output_subdir: longcat-semantic-only-smoke/${task}/${run_name}

runtime:
  acoustic_generator_artifact: ${oc.env:SPEECH_TO_SPEECH_ACOUSTIC_GENERATOR_ARTIFACT}
  device: cpu
  dtype: float32
  attn_implementation:

sample_index: 0

callbacks:
  task_sample:
    enabled: false
    every_n_steps: 1
  evaluation:
    enabled: false

train:
  seed: 0
  max_steps: 2

trainer:
  accelerator: cpu
  devices: 1
  precision: 32-true
  log_every_n_steps: 1
  enable_checkpointing: false
