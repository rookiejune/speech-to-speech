# @package _global_
defaults:
  - /callback/parameter_policy@callbacks.parameter_policy: full
  - /model: toy
  - /model/acoustic@model.acoustic: none
  - /runtime: bicodec
  - /datamodule/dataset@datamodule.dataset: qwen_tts_speaker
  - /pl_module: sft
  - /trainer: default
  - /logging: csv
  - _self_

audio_sequence_layout: flattened

task: tts
run_name: bicodec-generate-global
output_subdir: bicodec-generate-global-smoke/${task}/${run_name}

runtime:
  device: cpu
  dtype: float32
  attn_implementation:

sample_index: 0

datamodule:
  shape: single

callbacks:
  task_sample:
    enabled: false
    every_n_steps: 1
  evaluation:
    enabled: false

train:
  seed: 0
  max_steps: 2

trainer:
  accelerator: cpu
  devices: 1
  precision: 32-true
  log_every_n_steps: 1
  enable_checkpointing: false
