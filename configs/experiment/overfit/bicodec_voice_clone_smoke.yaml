# @package _global_
defaults:
  - /callback/parameter_policy@callbacks.parameter_policy: full
  - /model: toy
  - /model/acoustic@model.acoustic: none
  - /runtime: glm4_bicodec
  - /datamodule/dataset@datamodule.dataset: toy
  - /pl_module: sft
  - /trainer: default
  - /logging: csv
  - _self_

audio_sequence_layout: flattened

task: tts_voice_clone
run_name: bicodec-voice-clone-full-audio
output_subdir: bicodec-voice-clone-smoke/${task}/${run_name}

runtime:
  device: cpu
  dtype: float32
  attn_implementation:

sample_index: 0

datamodule:
  shape: pair

callbacks:
  task_sample:
    enabled: false
    every_n_steps: 1
  evaluation:
    enabled: false

train:
  seed: 0
  max_steps: 2

trainer:
  accelerator: cpu
  devices: 1
  precision: 32-true
  log_every_n_steps: 1
  enable_checkpointing: false
