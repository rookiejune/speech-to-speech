# @package _global_
defaults:
  - /callback/parameter_policy@callbacks.parameter_policy: full
  - /model: default
  - /model/acoustic@model.acoustic: none
  - /runtime: unicodec
  - /datamodule/dataset@datamodule.dataset: wmt19_tts
  - /pl_module: sft
  - /trainer: ddp
  - /logging: tensorboard
  - _self_

audio_sequence_layout: flattened

task: tts
run_name: token
output_subdir: 005-codec-screening/unicodec/ddp-smoke

sample_index: 0

callbacks:
  task_sample:
    enabled: true
    every_n_steps: 1

train:
  seed: 0
  max_steps: 2

trainer:
  log_every_n_steps: 1
  use_distributed_sampler: false
