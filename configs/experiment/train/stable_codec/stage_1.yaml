# @package _global_
defaults:
  - /runtime: stable_codec
  - /model: default
  - /model/acoustic@model.acoustic: none
  - /datamodule/dataset@datamodule.dataset: wmt19_tts
  - /callback/parameter_policy@callbacks.parameter_policy: speech_interface
  - /pl_module: sft
  - /trainer: staged_static_ddp
  - /logging: tensorboard
  - _self_

audio_sequence_layout: flattened

output_subdir: stable-codec/stage_1/${run_name}

loader_plan:
  loaders:
    asr:
      weight: 0.5
      task_weights:
        asr: 1.0
    tts:
      weight: 0.5
      task_weights:
        tts: 1.0
  accumulate_grad_batches: 2
  fuse_loaders_per_step: true

model:
  lora: null

train:
  max_steps: 1000000

validation:
  enabled: true
  loader: tts
  split_label: dev
  every_n_steps: 10000
  sanity_steps: 0

trainer:
  log_every_n_steps: 10
  enable_checkpointing: true

callbacks:
  task_sample:
    enabled: true
    every_n_steps: 10000
    seed: 0
    panels:
      - split: train
        loader: asr
        task: asr
        indices: [0, 1, 2]
      - split: train
        loader: tts
        task: tts
        indices: [0, 1, 2]
    max_new_tokens: 512
    temperature: 1.0
    top_p: 1.0
    do_sample: false
    use_cache: true
  checkpoint:
    filename: step-{step:08d}
    save_last: true
    save_top_k: -1
    every_n_train_steps: 10000
