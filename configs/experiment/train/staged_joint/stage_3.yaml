# @package _global_
defaults:
  - /runtime: longcat_native
  - /model: default
  - /model/acoustic@model.acoustic: rvq
  - /audio_sequence_layout: semantic
  - /datamodule/dataset@datamodule.dataset: wmt19_tts
  - /callback/parameter_policy@callbacks.parameter_policy: speech_interface_top_third
  - /pl_module: sft
  - /trainer: staged_static_ddp
  - /logging: tensorboard
  - _self_

output_subdir: staged-joint/stage_3/${run_name}

loader_plan:
  loaders:
    asr_s2tt:
      weight: 0.45
      task_weights:
        asr: 0.5
        s2tt: 0.5
    tts_t2st:
      weight: 0.45
      task_weights:
        tts: 0.5
        t2st: 0.5
    mt:
      weight: 0.1
      task_weights:
        mt: 1.0
  accumulate_grad_batches: 10
  fuse_loaders_per_step: true

model:
  lora: null

callbacks:
  task_sample:
    enabled: true
    panels:
      - split: train
        loader: asr_s2tt
        task: asr
        indices: [0, 1, 2]
      - split: train
        loader: asr_s2tt
        task: s2tt
        indices: [0, 1, 2]
      - split: train
        loader: tts_t2st
        task: tts
        indices: [0, 1, 2]
      - split: train
        loader: tts_t2st
        task: t2st
        indices: [0, 1, 2]
      - split: train
        loader: mt
        task: mt
        indices: [0, 1, 2]
