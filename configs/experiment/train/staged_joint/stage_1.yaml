# @package _global_
defaults:
  - /runtime: longcat_native
  - /model: default
  - /model/acoustic@model.acoustic: rvq
  - /datamodule/dataset@datamodule.dataset: wmt19_tts
  - /callback/parameter_policy@callbacks.parameter_policy: speech_interface
  - /pl_module: sft
  - /trainer: staged_static_ddp
  - /logging: tensorboard
  - _self_

audio_sequence_layout: semantic

output_subdir: staged-joint/s2st/stage_1/${run_name}

pl_module:
  ctc:
    source_weight: 1.0
    target_weight: 0.0

loader_plan:
  loaders:
    asr:
      weight: 0.45
      task_weights:
        asr: 1.0
    tts:
      weight: 0.45
      task_weights:
        tts: 1.0
    mt:
      weight: 0.1
      task_weights:
        mt: 1.0
  accumulate_grad_batches: 3
  step_mode: fused_joint

model:
  audio_input_adapter:
    type: transformer
    causal: false
  lora: null

callbacks:
  task_sample:
    enabled: true
    panels:
      - split: train
        loader: asr
        task: asr
        indices: [0, 1, 2]
      - split: train
        loader: tts
        task: tts
        indices: [0, 1, 2]
      - split: train
        loader: mt
        task: mt
        indices: [0, 1, 2]
