# @package _global_
defaults:
  - /runtime: longcat_native
  - /model: default
  - /model/lora@model.lora: qwen
  - /model/acoustic@model.acoustic: rvq
  - /audio_sequence_layout: semantic
  - /datamodule/dataset@datamodule.dataset: wmt19_tts
  - /callback/parameter_policy@callbacks.parameter_policy: lora
  - /pl_module: sft
  - /trainer: staged_static_ddp
  - /logging: tensorboard
  - _self_

output_subdir: staged-joint/stage_1/${run_name}

loader_plan:
  loaders:
    asr:
      weight: 0.5
      task_weights:
        asr: 1.0
    tts:
      weight: 0.5
      task_weights:
        tts: 1.0
  accumulate_grad_batches: 2
  fuse_loaders_per_step: true

callbacks:
  task_sample:
    enabled: true
    panels:
      - split: train
        loader: asr
        task: asr
        indices: [0, 1, 2]
      - split: train
        loader: tts
        task: tts
        indices: [0, 1, 2]
