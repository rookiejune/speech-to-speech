# @package _global_
defaults:
  - /runtime: longcat_native
  - /model: default
  - /model/acoustic@model.acoustic: rvq
  - /datamodule/dataset@datamodule.dataset: wmt19_tts
  - /callback/parameter_policy@callbacks.parameter_policy: speech_interface_top_third
  - /pl_module: sft
  - /trainer: staged_static_ddp
  - /logging: tensorboard
  - _self_

audio_sequence_layout: semantic

output_subdir: staged-joint/s2st/stage_2/${run_name}

loader_plan:
  loaders:
    asr:
      weight: 0.225
      task_weights:
        asr: 1.0
    s2tt:
      weight: 0.225
      task_weights:
        s2tt: 1.0
    tts:
      weight: 0.225
      task_weights:
        tts: 1.0
    t2st:
      weight: 0.225
      task_weights:
        t2st: 1.0
    mt:
      weight: 0.1
      task_weights:
        mt: 1.0
  accumulate_grad_batches: 5
  step_mode: fused_joint

pl_module:
  ctc:
    source:
      weight: 1.0
    target:
      weight: 1.0

model:
  audio_input_adapter:
    type: transformer
    causal: false
  lora: null

callbacks:
  task_sample:
    enabled: true
    panels:
      - split: train
        loader: asr
        task: asr
        indices: [0, 1, 2]
      - split: train
        loader: s2tt
        task: s2tt
        indices: [0, 1, 2]
      - split: train
        loader: tts
        task: tts
        indices: [0, 1, 2]
      - split: train
        loader: t2st
        task: t2st
        indices: [0, 1, 2]
      - split: train
        loader: mt
        task: mt
        indices: [0, 1, 2]
