# @package _global_
defaults:
  - /runtime: longcat_native
  - /model: default
  - /model/lora@model.lora: qwen
  - /model/acoustic@model.acoustic: rvq
  - /datamodule/dataset@datamodule.dataset: wmt19_tts
  - /callback/parameter_policy@callbacks.parameter_policy: lora
  - /pl_module: sft
  - /trainer: staged_ddp
  - /logging: tensorboard
  - _self_

audio_sequence_layout: semantic

output_subdir: staged-joint/s2st/stage_0/${run_name}

pl_module:
  ctc:
    source:
      weight: 0.0
    target:
      weight: 0.0

loader_plan:
  loaders:
    tts:
      weight: 0.9
      task_weights:
        tts: 1.0
    mt:
      weight: 0.1
      task_weights:
        mt: 1.0
  accumulate_grad_batches: 2
  step_mode: serial_joint

callbacks:
  task_sample:
    enabled: true
    panels:
      - split: train
        loader: tts
        task: tts
        indices: [0, 1, 2]
      - split: train
        loader: mt
        task: mt
        indices: [0, 1, 2]
