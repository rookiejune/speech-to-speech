# @package _global_
defaults:
  - /runtime: glm4_bicodec_composed
  - /model: default
  - /model/acoustic@model.acoustic: none
  - /datamodule/dataset@datamodule.dataset: streaming_s2st
  - /callback/parameter_policy@callbacks.parameter_policy: full
  - /pl_module: sft
  - /trainer: staged_static_ddp
  - /logging: tensorboard
  - _self_

# Every published sample directly supervises the backbone with the generated
# target text followed by the generated target audio/code sequence.
audio_sequence_layout: flattened

run_name: ${oc.env:SPEECH_TO_SPEECH_STREAM_RUN,streaming-s2st}
output_subdir: streaming-s2st/${run_name}

# Listed devices run workspace snapshot factories. Every other visible device
# is passed to Lightning for training.
devices:
  translation: [0]
  tts: [1]

# Keep one append-only TensorBoard directory across auto-resume invocations of
# the same logical run.
logging:
  version: 0

loader_plan:
  loaders:
    s2st:
      weight: 1.0
      task_weights:
        s2st: 1.0
      trace: target_cot
  accumulate_grad_batches: 1
  step_mode: weighted_window

datamodule:
  # Final S2ST snapshots publish waveform; codec views are encoded online in
  # the Lightning process.
  encode_missing_codes: true
  source:
    factory: zhuyin.datasets.s2st:source
    mode: auto
    options: {}
  dataloader:
    batch_size: 8
    num_workers: 0
    pin_memory: true
    persistent_workers: false
    costs:
      enabled: false
pl_module:
  ctc:
    source:
      weight: 1.0
    target:
      weight: 0.0

model:
  lora: null

train:
  max_steps: -1
  auto_resume: true

validation:
  enabled: false

trainer:
  max_epochs: 1
  use_distributed_sampler: false
  enable_checkpointing: true

callbacks:
  synthesis_sample:
    enabled: false
    every_n_steps: 100
    loader: s2st
    indices: []
  task_sample:
    enabled: false
  text_retention:
    enabled: false
  performance:
    enabled: false
  checkpoint:
    filename: step-{step:08d}
    # Keep the resume pointer without duplicating multi-GB checkpoints on NAS.
    save_last: link
    save_top_k: -1
    every_n_train_steps: 1000
