# @package _global_
# UniSS-style streaming pilot: composed source audio with a text CoT prompt.
defaults:
  - /experiment/train/streaming_s2st
  - override /runtime: glm4_bicodec_composed
  - _self_

run_name: ${oc.env:SPEECH_TO_SPEECH_UNISS_STREAM_RUN,uniss-qwen06b}

# Start the first concurrent probe with one sample per optimizer step.  Larger
# batches are explicit overrides after the composed source contract passes.
datamodule:
  dataloader:
    batch_size: 1
