# @package _global_
defaults:
  - /runtime: longcat_native
  - /model: toy
  - /model/acoustic@model.acoustic: rvq
  - /audio_sequence_layout: semantic
  - /datamodule/dataset@datamodule.dataset: toy
  - /stage@stage: stage_1
  - /callback/parameter_policy@callbacks.parameter_policy: speech_interface
  - /pl_module: sft
  - /trainer: staged_ddp
  - /logging: csv
  - _self_

stage_id: stage_1

run_name: parameter-policy-${callbacks.parameter_policy.name}
output_subdir: parameter-policy-smoke/${run_name}

runtime:
  device: cpu
  dtype: float32
  attn_implementation:

datamodule:
  dataloader:
    batch_size: 1
    num_workers: 0
    pin_memory: false
    persistent_workers: false

train:
  max_steps: 2

trainer:
  accelerator: cpu
  devices: 1
  precision: 32-true
  log_every_n_steps: 1
  enable_checkpointing: false

callbacks:
  checkpoint:
    every_n_train_steps: 1
