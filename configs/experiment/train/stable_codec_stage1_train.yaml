# @package _global_
defaults:
  - override /stage: stage_1
  - override /parameter_policy: speech_interface
  - override /runtime: stable_codec
  - override /audio_route: full_output
  - override /model/acoustic: none
  - override /trainer: staged_ddp
  - override /logging: tensorboard
  - _self_

output_subdir: stable-codec-stage1/${run_name}

train:
  max_steps: 1000000

validation:
  enabled: true
  loader: tts
  split_label: dev
  every_n_steps: 10000
  sanity_steps: 0

trainer:
  log_every_n_steps: 10
  enable_checkpointing: true

callbacks:
  task_sample:
    enabled: true
    every_n_steps: 10000
    seed: 0
    panels:
      - split: train
        loader: asr
        task: asr
        indices: [0, 1, 2]
      - split: validation
        loader: asr
        task: asr
        indices: [0, 1, 2]
      - split: train
        loader: tts
        task: tts
        indices: [0, 1, 2]
      - split: validation
        loader: tts
        task: tts
        indices: [0, 1, 2]
    max_new_tokens: 512
    temperature: 1.0
    top_p: 1.0
    do_sample: false
    use_cache: true
  checkpoint:
    filename: step-{step:08d}
    save_last: true
    save_top_k: -1
    every_n_train_steps: 10000
