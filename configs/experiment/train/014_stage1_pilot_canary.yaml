# @package _global_
defaults:
  - override /stage: stage_1
  - override /parameter_policy: speech_interface
  - override /trainer: ddp
  - _self_

output_subdir: 014-longcat-stable-stage1/pilot-canary/${run_name}

data:
  dataloader:
    batch_size: 1
    num_workers: 0
    pin_memory: false
    persistent_workers: false

validation:
  enabled: true
  loader: tts
  split_label: dev
  every_n_steps: 50
  sanity_steps: -1

train:
  max_steps: 100

trainer:
  log_every_n_steps: 1
  enable_checkpointing: true

callbacks:
  checkpoint:
    save_last: true
    save_top_k: -1
    every_n_train_steps: 50
