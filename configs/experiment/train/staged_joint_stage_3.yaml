# @package _global_
defaults:
  - override /stage: stage_3
  - override /parameter_policy: speech_interface_top_third
  - _self_

model:
  lora: null

callbacks:
  task_sample:
    enabled: true
    panels:
      - split: train
        loader: asr_s2tt
        task: asr
        indices: [0, 1, 2]
      - split: train
        loader: asr_s2tt
        task: s2tt
        indices: [0, 1, 2]
      - split: train
        loader: tts_t2st
        task: tts
        indices: [0, 1, 2]
      - split: train
        loader: tts_t2st
        task: t2st
        indices: [0, 1, 2]
      - split: train
        loader: mt
        task: mt
        indices: [0, 1, 2]
