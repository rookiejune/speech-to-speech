# @package _global_
defaults:
  - override /stage: stage_2
  - override /parameter_policy: speech_interface
  - _self_

callbacks:
  task_sample:
    enabled: true
    panels:
      - split: train
        loader: asr
        task: asr
        indices: [0, 1, 2]
      - split: train
        loader: tts
        task: tts
        indices: [0, 1, 2]
      - split: train
        loader: mt
        task: mt
        indices: [0, 1, 2]
