[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-to-speech"
version = "0.1.0"
description = "Speech-to-speech training, generation, and evaluation utilities."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "anydataset",
    "anytrain",
    "hydra-core>=1.3",
    "lightning>=2.0",
    "omegaconf>=2.3",
    "peft>=0.17.1,<0.21",
    "semantic-acoustic-generator",
    "tensorboard>=2.14",
    "tokenizers>=0.20",
    "torch>=2.8",
    "transformers>=4.46",
    "typing-extensions>=4.12",
    "zhuyin-workspace",
]

[project.optional-dependencies]
dev = [
    "basedpyright>=1.31",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
